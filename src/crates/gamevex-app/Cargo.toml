[package]
name = "gamevex-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gamevex-core = { path = "../gamevex-core" }
bevy = { version = "=0.17.3", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_audio", "bevy_color", "bevy_core_pipeline", "bevy_camera", "bevy_image", "bevy_mesh", "bevy_render", "bevy_shader", "bevy_sprite", "bevy_sprite_render", "bevy_text", "bevy_window", "bevy_winit", "bevy_log", "default_font", "multi_threaded", "webgpu", "wav", "png"] }
serde_json.workspace = true

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
web-sys = { version = "=0.3.106", features = ["Window", "Storage", "Document", "VisibilityState", "HtmlCanvasElement", "Element", "EventTarget", "Location", "Performance"] }
