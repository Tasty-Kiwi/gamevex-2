name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  macos-validation:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: cargo fmt --all -- --check
      - run: cargo test --locked --workspace
      - run: cargo clippy --locked --workspace --all-targets -- -D warnings
      - name: Install pinned wasm-bindgen CLI
        run: cargo install wasm-bindgen-cli --version 0.2.129 --locked
      - name: Build WebAssembly app
        run: scripts/build-web.sh
      - name: Package native macOS app
        run: |
          scripts/package-macos.sh
          ditto -c -k --sequesterRsrc --keepParent "target/GameVex Rust.app" "target/gamevex-macos.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: gamevex-web
          path: web/
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        with:
          name: gamevex-macos-app
          path: target/gamevex-macos.zip
          if-no-files-found: error
          retention-days: 7

  browser-regressions:
    needs: macos-validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/download-artifact@v4
        with:
          name: gamevex-web
          path: web/
      - run: npm ci
      - name: Install headless Chromium
        run: npx playwright install --with-deps chromium
      - name: Run browser regressions
        run: npm run test:browser
      - name: Upload browser failure artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7
