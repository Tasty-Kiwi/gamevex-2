[package]
name = "gamevex-app"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
gamevex-core = { path = "crates/gamevex-core" }
bevy = { version = "=0.17.3", default-features = false, features = ["std", "async_executor", "bevy_asset", "bevy_audio", "bevy_color", "bevy_core_pipeline", "bevy_camera", "bevy_image", "bevy_mesh", "bevy_render", "bevy_shader", "bevy_sprite", "bevy_sprite_render", "bevy_text", "bevy_window", "bevy_winit", "bevy_log", "default_font", "multi_threaded", "webgpu", "wav", "png"] }
serde_json.workspace = true

[target.'cfg(not(target_arch = "wasm32"))'.dev-dependencies]
rodio = { version = "=0.20.1", default-features = false, features = ["wav"] }

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "=0.2.129"
web-sys = { version = "=0.3.106", features = ["Window", "Storage", "Document", "VisibilityState", "HtmlCanvasElement", "Element", "EventTarget", "Location", "Performance", "BaseAudioContext", "Event", "AudioContext", "AudioContextState", "AudioBuffer", "AudioBufferSourceNode", "AudioNode", "AudioDestinationNode", "GainNode", "AudioParam"] }

[workspace]
members = ["crates/gamevex-core"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.145"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 1
strip = "debuginfo"
