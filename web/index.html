<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#080d1c">
    <meta name="description" content="Your local arcade of card, board, and puzzle games.">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="GameVex">
    <link rel="manifest" href="./manifest.webmanifest">
    <link rel="icon" type="image/png" href="./icons/icon-192.png">
    <link rel="apple-touch-icon" href="./icons/apple-touch-icon.png">
    <title>GameVex</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; background: #080d1c; color: #e9f7ff; }
      * { box-sizing: border-box; }
      body { margin: 0; height: 100dvh; overflow: auto; }
      main { position: relative; width: 100%; height: 100%; min-height: 560px; }
      /* Keyboard focus is drawn on the active control inside the canvas. */
      canvas { display: block; width: 100% !important; height: 100% !important; background: #020408; outline: none; user-select: none; -webkit-user-select: none; touch-action: none; }
      #status { position: absolute; inset: 35% 8% auto; padding: 2rem; background: #081428; border: 1px solid #00d4ff; color: #74e7f4; font-size: .9rem; pointer-events: none; }
      #status.error { color: #ff9eae; white-space: pre-wrap; }
    </style>
  </head>
  <body>
    <main aria-label="GameVex Rust arcade">
      <canvas id="gamevex" tabindex="0" aria-label="GameVex arcade game surface"></canvas>
      <p id="status" role="status" aria-live="polite">Checking browser graphics support…</p>
    </main>
    <script type="module" src="./loader.js"></script>
  </body>
</html>
